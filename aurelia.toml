# Aurelia (the chat engine). The particle maker reads nothing from here.

# Prim's word network: WordNet 3.1 as Primogenitus/motor keeps it.
wordnet = 'C:\Users\joose\Primogenitus\motor\data\wordnet\dict'

[block]
nx = 96            # lattice points; rings are the squares between them
ny = 96
nz = 44            # layers: 96x96x44 = 1.19 million particles, one for each sense, proposition, sentence and dialog reply
particles_per_ring = 3
layout_seed = 7    # which way each ring turns
spin_base = 0.06   # a ring's own pace, rad per step
spin_jitter = 0.3  # each reply's seed varies the paces this much
spin_drag = 0.04
spin_max = 0.9
flip_share = 0.15  # rings that turn against the checkerboard
axle = 0.02        # spin shared between stacked layers
wave_speed = 2.0   # ring widths per step
wave_width = 6.0
wave_kick = 0.05
wave_fronts = 12   # one message sends a train of fronts
front_gap = 24
idle_steps = 120   # the block turns on its own before each wave
rise = 0.6        # lift per step per rad/step of spin above a ring's pace
against_rise = 1.0 # a particle running against its ring rises this much slower
limit_gain = 10.0   # a ring's limit = 1 + limit_gain * the highest charge it holds
window = 0.15      # how near two particles must be at a shared corner to collide (rad)
lift_share = 0.08  # a collision evens this share of the lift difference
mesh = 0.05         # a collision pushes the two spins this far toward meshing
